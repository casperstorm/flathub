id: chat.moin.moin
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: moin
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
modules:
  - name: moin
    buildsystem: simple
    build-commands:
      - install -d /app/chat.moin.moin
      - cp -a lib/moin/. /app/chat.moin.moin/
      - cp -a share /app/
      - install -d /app/bin
      - ln -s /app/chat.moin.moin/moin_flutter /app/bin/moin
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://moin.chat/downloads/linux/0.1.0/moin-0.1.0-linux-x86_64.tar.xz
        sha256: '840c4c92358a1af96e3bc27e858616c1e97649d97abc240170324d60e4485b76'
        strip-components: 0
